[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lorekeeper"
dynamic = ["version"]
description = "A plain-text story-world engine for writers, worldbuilders and agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lore = "lorekeeper.cli:main"

[tool.setuptools]
packages = ["lorekeeper"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "lorekeeper.__version__"}

[tool.setuptools.package-data]
lorekeeper = ["editor.html", "editor.js", "editor.css", "favicon.svg", "app.html", "app.js", "app.css", "lorekeeper.ico", "agent-skill.md"]
