<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="lore-token" content="__LORE_TOKEN__">
  <meta name="lore-saga" content="__LORE_SAGA__">
  <meta name="lore-calendars" content="__LORE_CALENDARS__">
  <meta name="lore-name" content="__LORE_NAME__">
  <title>Lorekeeper</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/editor.css">
  <script type="module" src="/editor.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="wordmark">Lorekeeper</span>
      <span id="world" class="world"></span>
      <span id="mode" class="mode" hidden>Proposals only</span>
    </div>
    <div class="find" role="search">
      <label for="find" class="sr-only">Find an item</label>
      <input id="find" type="search" list="find-list" placeholder="Find an item" autocomplete="off" spellcheck="false">
      <kbd class="find-key" aria-hidden="true">/</kbd>
      <datalist id="find-list"></datalist>
    </div>
    <details id="new-item" class="new-item">
      <summary class="button primary">New item</summary>
      <form id="create-form" class="popover">
        <label for="create-type">Type</label>
        <select id="create-type"></select>
        <label for="create-name">Name</label>
        <input id="create-name" required autocomplete="off">
        <button type="submit" class="primary">Create</button>
      </form>
    </details>
    <div id="status" class="status" role="status" aria-live="polite" data-kind="busy">Loading your world…</div>
  </header>
  <nav class="tabs" aria-label="World views">
    <div role="tablist" aria-label="World views">
      <button id="tab-timeline" role="tab" data-view="Timeline" aria-selected="true" aria-controls="view">Timeline</button>
      <button id="tab-subway" role="tab" data-view="Subway" aria-selected="false" aria-controls="view" tabindex="-1">Subway</button>
      <button id="tab-relationships" role="tab" data-view="Relationships" aria-selected="false" aria-controls="view" tabindex="-1">Relationships</button>
      <button id="tab-ages" role="tab" data-view="Ages" aria-selected="false" aria-controls="view" tabindex="-1">Ages</button>
      <button id="tab-spreadsheet" role="tab" data-view="Spreadsheet" aria-selected="false" aria-controls="view" tabindex="-1">Spreadsheet</button>
      <button id="tab-narrative" role="tab" data-view="Narrative" aria-selected="false" aria-controls="view" tabindex="-1">Narrative</button>
      <button id="tab-continuity" role="tab" data-view="Continuity" aria-selected="false" aria-controls="view" tabindex="-1">Continuity <span id="check-badge" class="badge" hidden></span></button>
    </div>
    <details class="shortcuts">
      <summary>Shortcuts</summary>
      <dl class="popover">
        <dt><kbd>/</kbd></dt><dd>Find an item</dd>
        <dt><kbd>Ctrl</kbd> <kbd>S</kbd></dt><dd>Save the inspector</dd>
        <dt><kbd>Esc</kbd></dt><dd>Leave a field or close a message</dd>
        <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>Previous or next item on a chart</dd>
        <dt><kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd></dt><dd>Zoom in, out, or fit everything</dd>
        <dt><kbd>Shift</kbd> + wheel</dt><dd>Move along the timeline</dd>
      </dl>
    </details>
  </nav>
  <main>
    <section class="workspace" aria-label="World view">
      <div id="view" role="tabpanel" aria-labelledby="tab-timeline"></div>
    </section>
    <aside id="inspector-panel" class="inspector" aria-label="Inspector">
      <div id="inspector"></div>
    </aside>
  </main>
  <div id="toasts" class="toasts"></div>
</body>
</html>
